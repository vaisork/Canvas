<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canvas · Index de prueba</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#f5f2eb;color:#171717;display:grid;place-items:center;min-height:100vh}p{opacity:.65}</style>
</head>
<body>
<p>Cargando versión de prueba de Canvas…</p>
<script>
(async()=>{
  const html = await fetch('index.html?preview=' + Date.now(), {cache:'no-store'}).then(r=>r.text());
  const extraCss = `
.manifestoHero{padding:58px 0 76px;background:#f5f2eb;overflow:hidden}
.manifestoHero .manifestoWrap{width:min(1280px,calc(100% - 34px));margin:auto}
.manifestoKicker{font-size:.72rem;letter-spacing:.19em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:12px}
.manifestoTitle{font:600 clamp(3.2rem,6vw,5.9rem)/.92 "Cormorant Garamond",serif;letter-spacing:-.04em;margin:0 0 32px;max-width:11ch}
.manifestoTitle em{color:var(--yellow);font-style:italic}
.manifestoGrid{display:grid;grid-template-columns:minmax(0,.88fr) minmax(470px,1.12fr);gap:54px;align-items:center}
.manifestoNote{position:relative;background:#fffdf7;border:1px solid #e8e0d2;padding:clamp(30px,4vw,54px);box-shadow:0 20px 50px #00000012;transform:rotate(-.35deg)}
.manifestoNote:before{content:"";position:absolute;left:0;top:0;width:7px;height:100%;background:var(--yellow)}
.manifestoHand{font-family:"Nothing You Could Do",cursive;font-size:clamp(1.05rem,1.55vw,1.34rem);line-height:1.55;letter-spacing:.005em;color:#191919}
.manifestoHand p{margin:0 0 .9em}.manifestoEm{font-weight:600}
.manifestoSignature{margin-top:1.2em;text-align:right;font:600 clamp(1.9rem,3vw,2.7rem)/1 "Nothing You Could Do",cursive;transform:rotate(-3deg)}
.memoryCollage{position:relative;min-height:720px}.memoryShot{position:absolute;background:#fff;padding:9px 9px 38px;box-shadow:0 18px 42px #00000024;border:1px solid #e4ded2}.memoryShot img{width:100%;height:100%;display:block;object-fit:cover}.memoryShot.main{width:78%;height:405px;left:3%;top:8px;transform:rotate(2deg);z-index:2}.memoryShot.garden{width:54%;height:340px;left:0;top:390px;transform:rotate(-4deg);z-index:3}.memoryShot.deck{width:52%;height:315px;right:0;top:410px;transform:rotate(4deg);z-index:4}.memoryLabel{position:absolute;left:18px;bottom:8px;font:600 1.45rem/1 "Nothing You Could Do",cursive;color:#25231f}.memoryTape{position:absolute;width:88px;height:25px;background:#d9c9a7aa;top:-12px;left:50%;transform:translateX(-50%) rotate(-3deg);z-index:5}.collageWhisper{position:absolute;right:1%;top:56px;width:120px;font:600 1rem/1.45 "Nothing You Could Do",cursive;transform:rotate(4deg);color:#4a4741}.collageWhisper.bottom{top:auto;bottom:12px;right:8%;width:150px;transform:rotate(-5deg)}
.manifestoNext{margin-top:54px;text-align:center}.manifestoNext small{display:block;color:var(--muted);text-transform:uppercase;letter-spacing:.17em;margin-bottom:7px}.manifestoNext strong{display:block;font:600 clamp(2.8rem,6vw,4.8rem)/.94 "Cormorant Garamond",serif}

.previewSpaces{position:relative;background:#101312;color:#fff;padding:76px 0 66px;overflow:hidden;border-bottom:10px solid var(--blue)}
.previewSpaces:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 40%,rgba(117,142,102,.22),transparent 23%),radial-gradient(circle at 86% 48%,rgba(173,132,82,.15),transparent 28%),linear-gradient(90deg,#0b0d0d 0%,#171917 56%,#101110 100%);opacity:.95}
.previewSpaces:after{content:"IDEAS\\A PERSONAS\\A ESPACIOS\\A REALIDAD.";white-space:pre;position:absolute;right:5.5%;top:92px;color:#bebdb6;font:500 1rem/1.75 "Cormorant Garamond",serif;letter-spacing:.18em;transform:rotate(-4deg);opacity:.86}
.previewSpaces .spacesInner{position:relative;z-index:2;width:min(1120px,calc(100% - 34px));margin:auto}
.previewSpaces .born{text-align:center;text-transform:uppercase;letter-spacing:.28em;font-size:.67rem;color:#c9c8c1;margin-bottom:4px}
.previewSpaces .bornTitle{text-align:center;font:600 clamp(3.5rem,6vw,5.1rem)/.95 "Cormorant Garamond",serif;margin:0 0 40px}
.previewSpaces .spacesIntro{display:grid;grid-template-columns:.9fr 1.1fr;gap:64px;align-items:end;margin-bottom:38px;padding:0 34px}
.previewSpaces .spacesIntro h2{font:600 clamp(3.5rem,6.3vw,5.8rem)/.83 "Cormorant Garamond",serif;letter-spacing:-.04em;margin:0;max-width:7ch;color:#fff}
.previewSpaces .spacesIntro p{margin:0;color:#d4d4cf;line-height:1.7;max-width:520px;font-size:.97rem}
.previewCards{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;align-items:stretch}
.previewCard{min-height:205px;padding:24px 22px 20px;background:#fff;color:#171717;border-top:4px solid var(--accent);display:flex;flex-direction:column;justify-content:space-between;transition:transform .2s ease,box-shadow .2s ease}
.previewCard:hover{transform:translateY(-5px);box-shadow:0 18px 34px #0008}
.previewCard small{font-size:.73rem;letter-spacing:.01em;color:#383838}.previewCard strong{display:block;font:600 clamp(1.55rem,2.3vw,2.15rem)/.94 "Cormorant Garamond",serif;margin:10px 0 16px}.previewCard img{width:84px;height:58px;object-fit:contain;object-position:left center}.previewCard.c90{--accent:#167E8C;background:#e9f6f7}.previewCard.garden{--accent:#57935A;background:#edf6ec}.previewCard.deck{--accent:#B27449;background:#f9eee7}.previewCard.origin{--accent:#E0A51E;background:#fff6da}.previewCard.pulse{--accent:#E8644F;background:#fde9e5}

.previewFooter{background:#111;color:#d8d8d4;padding:30px 0}.previewFooterInner{width:min(1180px,calc(100% - 34px));margin:auto;display:flex;justify-content:space-between;gap:30px;align-items:center}.previewFooterBrand strong{font-family:"Cormorant Garamond",serif;font-size:1.5rem;letter-spacing:.2em;color:#fff}.previewFooterBrand span{display:block;font-size:.72rem;color:#aaa;margin-top:4px}.previewSocial{display:flex;align-items:center;gap:24px;flex-wrap:wrap}.previewSocial a{display:inline-flex;align-items:center;gap:8px;color:#ddd;text-decoration:underline;font-size:.76rem}.previewSocial svg{width:20px;height:20px;flex:0 0 20px}

@media(max-width:980px){.manifestoGrid{grid-template-columns:1fr}.memoryCollage{min-height:650px;max-width:760px;width:100%;margin:auto}.manifestoNote{transform:none}.previewCards{grid-template-columns:repeat(2,1fr)}.previewSpaces .spacesIntro{grid-template-columns:1fr;gap:22px}.previewSpaces:after{display:none}}
@media(max-width:620px){.manifestoHero{padding:42px 0 54px}.manifestoHero .manifestoWrap{width:calc(100% - 22px)}.manifestoNote{padding:28px 24px 30px 32px}.manifestoHand{font-size:1.08rem;line-height:1.52}.memoryCollage{min-height:520px;margin-top:8px}.memoryShot.main{width:88%;height:285px;left:6%}.memoryShot.garden{width:58%;height:245px;top:270px}.memoryShot.deck{width:56%;height:235px;top:290px}.collageWhisper{display:none}.memoryLabel{font-size:1.12rem}.previewSpaces{padding:58px 0 48px}.previewSpaces .spacesInner{width:calc(100% - 22px)}.previewSpaces .spacesIntro{padding:0}.previewSpaces .bornTitle{margin-bottom:30px}.previewCards{grid-template-columns:1fr}.previewCard{min-height:155px}.previewFooterInner{align-items:flex-start;flex-direction:column}.previewSocial{gap:15px 20px}}
`;

  const hero = `<section class="manifestoHero" id="inicio"><div class="manifestoWrap"><div class="manifestoKicker">Por qué existe Canvas</div><h1 class="manifestoTitle">Un lugar para <em>crear,</em> compartir y ser.</h1><div class="manifestoGrid"><article class="manifestoNote"><div class="manifestoHand"><p>Canvas nació de algo simple: disfrutar un espacio y darnos cuenta de que se disfruta el doble cuando se comparte. Aquí hemos trabajado, soñado y visto crecer proyectos que se nos quedaron grabados.</p><p>Sabemos lo que se siente tener una idea y no tener dónde hacerla realidad. No queremos que se quede esperando.</p><p>Queremos que esa maestra forme su primer grupo. Que ese taller por fin tenga salón. Que esa idea encuentre su mesa, su pared, sus primeras horas de vida.</p><p>Canvas sigue siendo nuestro espacio, y por eso lo compartimos: un espacio vacío es solo paredes. Cuando alguien hace algo suyo ahí dentro, cobra vida.</p><p class="manifestoEm">No necesitas tener tu propio local para empezar a construir algo propio.</p><div class="manifestoSignature">J VSK</div></div></article><aside class="memoryCollage" aria-label="Collage de Canvas 90, el jardín y el deck"><figure class="memoryShot main"><span class="memoryTape"></span><img id="collageCanvas90" alt="Canvas 90"><figcaption class="memoryLabel">Canvas 90</figcaption></figure><figure class="memoryShot garden"><span class="memoryTape"></span><img id="collageGarden" alt="El Jardín de Canvas"><figcaption class="memoryLabel">Jardín</figcaption></figure><figure class="memoryShot deck"><span class="memoryTape"></span><img id="collageDeck" alt="Canvas Deck"><figcaption class="memoryLabel">Deck</figcaption></figure><div class="collageWhisper">espacios para grandes comienzos ♡</div><div class="collageWhisper bottom">mismas raíces,<br>más posibilidades</div></aside></div><div class="manifestoNext"><small>De esa idea nace</small><strong>Canvas 90</strong></div></div></section>`;

  const spaces = `<section class="previewSpaces" id="espacios"><div class="spacesInner"><div class="born">De esa idea nace</div><div class="bornTitle">Canvas 90</div><div class="spacesIntro"><h2>Cada idea tiene su lugar.</h2><p>Canvas reúne espacios de distintas escalas para proyectos que necesitan amplitud, exterior o un entorno más íntimo. Cada uno tiene su propio carácter, pero todos comparten la misma intención: darte un lugar para hacer que tu proyecto suceda.</p></div><div class="previewCards"><a class="previewCard c90" href="espacios/canvas90.html"><div><small>Amplio · transformable</small><strong>Canvas 90</strong></div><img src="assets/img/icon-canvas90.png" alt="Icono Canvas 90"></a><a class="previewCard garden" href="espacios/jardin.html"><div><small>Exterior · abierto</small><strong>El Jardín de Canvas</strong></div><img src="assets/img/icon-jardin.png" alt="Icono Jardín"></a><a class="previewCard deck" href="espacios/deck.html"><div><small>Exterior · urbano</small><strong>Canvas Deck</strong></div><img src="assets/img/icon-deck.png" alt="Icono Canvas Deck"></a><a class="previewCard origin" href="espacios/origen.html"><div><small>Íntimo · comienzo</small><strong>Canvas Origen</strong></div><img src="assets/img/icon-origen.png" alt="Icono Canvas Origen"></a><a class="previewCard pulse" href="espacios/pulso.html"><div><small>Íntimo · continuidad</small><strong>Canvas Pulso</strong></div><img src="assets/img/icon-pulso.png" alt="Icono Canvas Pulso"></a></div></div></section>`;

  const footer = `<footer class="previewFooter"><div class="previewFooterInner"><div class="previewFooterBrand"><strong>CANVAS</strong><span>Espacios para proyectos independientes</span></div><div class="previewSocial"><a href="#" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>Instagram</a><a href="#" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.3 8.4V6.7c0-.8.5-1 1.2-1h1.7V2.2L14.7 2c-3.4 0-4.2 2-4.2 4.4v2H8v3.9h2.5V22h4v-9.7h2.7l.4-3.9h-3.3z"/></svg>Facebook</a><a href="ubicacion/index.html" aria-label="Ubicación"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12z"/><circle cx="12" cy="9" r="2.4"/></svg>Ubicación</a><a href="https://wa.me/527821402617?text=Hola%2C%20vi%20la%20p%C3%A1gina%20de%20Canvas%20y%20quiero%20conocer%20los%20espacios%20para%20mi%20proyecto." target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 11.6a8 8 0 0 1-11.8 7l-4.2 1.1 1.1-4A8 8 0 1 1 20 11.6z"/><path d="M9 8.2c.3-.5.6-.5.9-.5h.4c.2 0 .4.1.5.4l.8 1.9c.1.3 0 .5-.2.7l-.6.7c-.2.2-.2.4-.1.6.5 1.1 1.4 2 2.5 2.6.2.1.4.1.6-.1l.8-1c.2-.2.4-.3.7-.2l1.9.9c.3.1.4.3.4.5 0 .4-.2 1.2-.6 1.6-.5.5-1.2.8-2 .7-1.1-.1-2.5-.7-4.2-2.2-1.5-1.3-2.5-2.9-2.8-3.9-.3-1-.1-2 .4-2.7z"/></svg>WhatsApp</a></div></div></footer>`;

  let out = html.replace('</style>', extraCss + '\n</style>');
  out = out.replace(/<section class="hero" id="inicio">[\s\S]*?<\/section>/, hero);
  out = out.replace(/<section class="intro">[\s\S]*?<\/section>/, '');
  out = out.replace(/<section class="spaces" id="espacios">[\s\S]*?<\/section>/, spaces);
  out = out.replace(/<footer>[\s\S]*?<\/footer>/, footer);
  out = out.replace('<title>Canvas | Un lugar para crear, compartir y ser</title>', '<title>Canvas | Prueba carta y espacios</title>');
  document.open();document.write(out);document.close();
  requestAnimationFrame(()=>{
    const spacePhotos=[...document.querySelectorAll('.photoMain img')], canvas90=spacePhotos[0], garden=spacePhotos[1]||canvas90, deck=spacePhotos[2]||garden;
    const set=(id,img)=>{const el=document.getElementById(id);if(el&&img)el.src=img.src};set('collageCanvas90',canvas90);set('collageGarden',garden);set('collageDeck',deck);
  });
})().catch(err=>{document.body.innerHTML='<p>No se pudo cargar la prueba.</p>';console.error(err)});
</script>
</body>
</html>
