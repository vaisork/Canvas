  const hero=`<section class="manifestoHero" id="inicio"><div class="manifestoWrap"><div class="manifestoKicker">Por qué existe Canvas</div><h1 class="manifestoTitle">Un lugar para <em>crear,</em> compartir y ser.</h1><div class="manifestoGrid"><article class="manifestoNote"><div class="manifestoHand"><p>Canvas nació de algo simple: disfrutar un espacio y darnos cuenta de que se disfruta el doble cuando se comparte. Aquí hemos trabajado, soñado y visto crecer proyectos que se nos quedaron grabados.</p><p>Sabemos lo que se siente tener una idea y no tener dónde hacerla realidad. No queremos que se quede esperando.</p><p>Queremos que esa maestra forme su primer grupo. Que ese taller por fin tenga salón. Que esa idea encuentre su mesa, su pared, sus primeras horas de vida.</p><p>Canvas sigue siendo nuestro espacio, y por eso lo compartimos: un espacio vacío es solo paredes. Cuando alguien hace algo suyo ahí dentro, cobra vida.</p><p class="manifestoEm">No necesitas tener tu propio local para empezar a construir algo propio.</p><div class="manifestoSignature">J VSK</div></div></article><aside class="memoryCollage"><figure class="memoryShot main"><span class="memoryTape"></span><img id="collageCanvas90"><figcaption class="memoryLabel">Canvas 90</figcaption></figure><figure class="memoryShot garden"><span class="memoryTape"></span><img id="collageGarden"><figcaption class="memoryLabel">Jardín</figcaption></figure><figure class="memoryShot deck"><span class="memoryTape"></span><img id="collageDeck"><figcaption class="memoryLabel">Deck</figcaption></figure></aside></div><div class="manifestoNext"><small>De esa idea nace</small><strong>Canvas 90</strong></div></div></section>`;

  const spaces=`<section class="previewSpaces" id="espacios"><div class="spacesInner"><div class="spacesIntro"><h2>Cada idea tiene su lugar.</h2><p>Canvas reúne espacios de distintas escalas para proyectos que necesitan amplitud, exterior o un entorno más íntimo. Cada uno tiene su propio carácter, pero todos comparten la misma intención: darte un lugar para hacer que tu proyecto suceda.</p></div><div class="previewCards"><a class="previewCard c90" href="espacios/canvas90.html"><div><small>Amplio · transformable</small><strong>Canvas 90</strong></div><img src="assets/img/icon-canvas90.png"></a><a class="previewCard pulse" href="espacios/pulso.html"><div><small>Íntimo · continuidad</small><strong>Canvas Pulso</strong></div><img src="assets/img/icon-pulso.png"></a><a class="previewCard origin" href="espacios/origen.html"><div><small>Íntimo · comienzo</small><strong>Canvas Origen</strong></div><img src="assets/img/icon-origen.png"></a><a class="previewCard garden" href="espacios/jardin.html"><div><small>Exterior · abierto</small><strong>El Jardín de Canvas</strong></div><img src="assets/img/icon-jardin.png"></a><a class="previewCard deck" href="espacios/deck.html"><div><small>Exterior · urbano</small><strong>Canvas Deck</strong></div><img src="assets/img/icon-deck.png"></a></div></div></section>`;

  const c90=`<section class="spaceSpotlight spot-c90"><div class="spotInner"><div><div class="spotEyebrow">Canvas 90 · espacio principal</div><h2>Dale espacio para crecer.</h2><div class="spotLine"></div><p>Un salón amplio y transformable para clases, movimiento, fotografía, talleres, encuentros y proyectos que necesitan más libertad.</p><a href="espacios/canvas90.html">Conoce Canvas 90 →</a></div><figure class="spotPhoto"><img id="spotCanvas90"><span>Canvas 90</span></figure></div></section>`;
  const pulso=`<section class="spaceSpotlight spot-pulso"><div class="spotInner"><div><div class="spotEyebrow">Canvas Pulso · 16 m²</div><h2>Un lugar para darle continuidad a tu proyecto.</h2><div class="spotLine"></div><p>Un espacio para reuniones pequeñas, trabajo concentrado, sesiones y proyectos que necesitan un lugar propio sin requerir un salón grande.</p><a href="espacios/pulso.html">Conoce Canvas Pulso →</a></div><figure class="spotPhoto"><img src="${pulsoImg}"><span>Canvas Pulso</span></figure></div></section>`;
  const origen=`<section class="spaceSpotlight spot-origen"><div class="spotInner"><div><div class="spotEyebrow">Canvas Origen · 5 m²</div><h2>Todo proyecto necesita un lugar donde empezar.</h2><div class="spotLine"></div><p>El espacio más pequeño de Canvas. Íntimo, independiente y pensado para esos primeros pasos: trabajar, conversar, reunirse o darle forma a una idea.</p><a href="espacios/origen.html">Conoce Canvas Origen →</a></div><figure class="spotPhoto"><img src="assets/img/canvas-origen-real.jpg"><span>Canvas Origen</span></figure></div></section>`;
  const jardin=`<section class="spaceSpotlight spot-jardin"><div class="spotInner"><div><div class="spotEyebrow">El Jardín de Canvas</div><h2>Que la idea también salga afuera.</h2><div class="spotLine"></div><p>Un exterior abierto que complementa Canvas 90 y permite llevar reuniones, actividades y momentos de descanso hacia el jardín.</p><a href="espacios/jardin.html">Conoce El Jardín →</a></div><figure class="spotPhoto"><img id="spotGarden"><span>El Jardín</span></figure></div></section>`;
  const deck=`<section class="spaceSpotlight spot-deck"><div class="spotInner"><div><div class="spotEyebrow">Canvas Deck</div><h2>Espacio para abrir la idea.</h2><div class="spotLine"></div><p>Una terraza exterior con vista y carácter propio para conversar, trabajar, hacer una pausa o extender una actividad hacia afuera.</p><a href="espacios/deck.html">Conoce Canvas Deck →</a></div><figure class="spotPhoto"><img id="spotDeck"><span>Canvas Deck</span></figure></div></section>`;

  const footer=`<footer class="previewFooter"><div class="previewFooterInner"><div class="previewFooterBrand"><strong>CANVAS</strong><span>Espacios para proyectos independientes</span></div><div class="previewSocial"><a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>Instagram</a><a href="#"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.3 8.4V6.7c0-.8.5-1 1.2-1h1.7V2.2L14.7 2c-3.4 0-4.2 2-4.2 4.4v2H8v3.9h2.5V22h4v-9.7h2.7l.4-3.9h-3.3z"/></svg>Facebook</a><a href="ubicacion/index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12z"/><circle cx="12" cy="9" r="2.4"/></svg>Ubicación</a><a href="https://wa.me/527821402617?text=Hola%2C%20vi%20la%20p%C3%A1gina%20de%20Canvas%20y%20quiero%20conocer%20los%20espacios%20para%20mi%20proyecto." target="_blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 11.6a8 8 0 0 1-11.8 7l-4.2 1.1 1.1-4A8 8 0 1 1 20 11.6z"/></svg>WhatsApp</a></div></div></footer>`;

  let out=html.replace('</style>',css+'\n</style>');
