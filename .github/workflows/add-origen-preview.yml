name: Add Canvas Origen preview

on:
  push:
    paths:
      - '.github/workflows/add-origen-preview.yml'

permissions:
  contents: write

jobs:
  patch-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Canvas Origen section to preview index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index-prueba.html')
          t = p.read_text()

          css = r'''
.originSpotlight{background:#fffaf0;padding:84px 0;border-top:1px solid #ead9a9;border-bottom:1px solid #ead9a9}
.originSpotlight .originInner{width:min(1180px,calc(100% - 34px));margin:auto;display:grid;grid-template-columns:.9fr 1.1fr;gap:54px;align-items:center}
.originCopy .originEyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:.7rem;font-weight:800;color:#8a6a12;margin-bottom:12px}
.originCopy h2{font:600 clamp(3.4rem,6vw,5.7rem)/.88 "Cormorant Garamond",serif;letter-spacing:-.04em;margin:0 0 22px;color:#171717}
.originCopy p{font-size:1.05rem;line-height:1.75;color:#4d4a42;max-width:34rem}
.originCopy .originLine{width:82px;height:6px;background:#E0A51E;margin:22px 0}
.originCopy a{display:inline-flex;margin-top:10px;border:1px solid #171717;padding:11px 15px;font-weight:700;color:#171717;text-decoration:none}
.originPhoto{position:relative;background:#fff;padding:10px 10px 42px;box-shadow:0 18px 40px #0000001d;transform:rotate(.6deg)}
.originPhoto img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
.originPhoto span{position:absolute;left:22px;bottom:10px;font:600 1.45rem/1 "Nothing You Could Do",cursive;color:#37332c}
.originPhoto:before{content:"";position:absolute;width:94px;height:25px;top:-12px;left:50%;transform:translateX(-50%) rotate(-3deg);background:#d8c59d99}
@media(max-width:900px){.originSpotlight .originInner{grid-template-columns:1fr}.originPhoto{transform:none}}
@media(max-width:620px){.originSpotlight{padding:60px 0}.originSpotlight .originInner{width:calc(100% - 22px)}.originCopy h2{font-size:3.5rem}}
'''
          if '.originSpotlight{' not in t:
              t = t.replace('\n.previewFooter{', css + '\n.previewFooter{', 1)

          origin = '''<section class="originSpotlight" id="canvas-origen-preview"><div class="originInner"><div class="originCopy"><div class="originEyebrow">Canvas Origen · 5 m²</div><h2>Todo proyecto necesita un lugar donde empezar.</h2><div class="originLine"></div><p>El espacio más pequeño de Canvas. Íntimo, independiente y pensado para esos primeros pasos: trabajar, conversar, reunirse o darle forma a una idea sin necesitar un lugar grande.</p><a href="espacios/origen.html">Conoce Canvas Origen →</a></div><figure class="originPhoto"><img src="assets/img/canvas-origen-real.jpg" alt="Canvas Origen"><span>Canvas Origen</span></figure></div></section>'''
          marker = '  const footer = `'
          if 'const originSpotlight =' not in t:
              t = t.replace(marker, '  const originSpotlight = `' + origin + '`;\n\n' + marker, 1)

          hook = "    const spacePhotos = [...document.querySelectorAll('.photoMain img')];"
          if "insertAdjacentHTML('afterend', originSpotlight)" not in t:
              t = t.replace(hook, "    const previewSpaces = document.querySelector('.previewSpaces');\n    if(previewSpaces) previewSpaces.insertAdjacentHTML('afterend', originSpotlight);\n" + hook, 1)

          p.write_text(t)
          PY
      - name: Commit change
        run: |
          git config user.name "Canvas Web Bot"
          git config user.email "canvas-web-bot@users.noreply.github.com"
          git add index-prueba.html
          git commit -m "Agregar Canvas Origen al index de prueba"
          git push
