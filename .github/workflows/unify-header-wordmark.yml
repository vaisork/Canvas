name: Unify Canvas header wordmark

on:
  push:
    paths:
      - '.github/workflows/unify-header-wordmark.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Canvas wordmark typography
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text()
          old = '.brand{font-weight:800;letter-spacing:.23em}'
          new = '.brand{font-family:"Cormorant Garamond",serif;font-size:2.1rem;font-weight:600;letter-spacing:.16em;line-height:1}'
          if old not in t:
              raise SystemExit('Expected brand rule not found')
          t = t.replace(old, new, 1)
          p.write_text(t)
          PY
      - name: Commit change
        run: |
          git config user.name "Canvas Web Bot"
          git config user.email "canvas-web-bot@users.noreply.github.com"
          git add index.html
          git commit -m "Unificar tipografía CANVAS en encabezado principal"
          git push
