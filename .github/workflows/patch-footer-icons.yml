name: Patch footer icons

on:
  push:
    paths:
      - '.github/workflows/patch-footer-icons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace footer labels with icons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index-prueba.html')
          html = path.read_text(encoding='utf-8')

          social = '''<div class="social">
            <a href="https://www.instagram.com/canvas_90/" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram">
              <svg viewBox="0 0 24 24" aria-hidden="true" style="width:28px;height:28px" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>
            </a>
            <a href="#" aria-label="Facebook" title="Facebook">
              <svg viewBox="0 0 24 24" aria-hidden="true" style="width:28px;height:28px" fill="currentColor"><path d="M13.7 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.5 1.6-1.5H17V3.9c-.3 0-1.3-.1-2.4-.1-2.4 0-4 1.4-4 4.1V10H8v3h2.6v8h3.1Z"/></svg>
            </a>
            <a href="ubicacion/" aria-label="Ubicación" title="Ubicación">
              <svg viewBox="0 0 24 24" aria-hidden="true" style="width:28px;height:28px" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s6-5.1 6-11a6 6 0 1 0-12 0c0 5.9 6 11 6 11Z"/><circle cx="12" cy="10" r="2.2"/></svg>
            </a>
            <a href="https://wa.me/527821402617?text=Hola%2C%20vi%20la%20p%C3%A1gina%20de%20Canvas%20y%20quiero%20conocer%20los%20espacios%20para%20mi%20proyecto." target="_blank" rel="noopener" aria-label="WhatsApp" title="WhatsApp">
              <svg viewBox="0 0 24 24" aria-hidden="true" style="width:28px;height:28px" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20.4 11.8a8.4 8.4 0 0 1-12.4 7.4L4 20.3l1.1-3.9A8.4 8.4 0 1 1 20.4 11.8Z"/><path d="M9 7.8c.2-.4.5-.4.8-.4h.5c.2 0 .4 0 .5.4l.8 1.8c.1.3.1.5-.1.7l-.6.8c-.2.2-.2.4-.1.7.5 1.1 1.4 2 2.5 2.6.3.2.5.1.7-.1l.8-1c.2-.3.5-.3.8-.2l1.8.9c.3.1.4.3.4.5 0 .7-.3 1.4-.8 1.8-.6.5-1.4.8-2.3.6-1.1-.2-2.7-.9-4.5-2.5-1.5-1.3-2.5-2.9-2.8-4-.3-1 .1-2 .6-2.6Z"/></svg>
            </a>
          </div>'''

          pattern = r'<div class="social">.*?</div></div></footer>'
          replacement = social + '</div></footer>'
          updated, count = re.subn(pattern, replacement, html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one footer social block, found {count}')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit footer update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-prueba.html
          git commit -m "Cambiar links del footer por iconos"
          git push
