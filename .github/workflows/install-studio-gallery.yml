name: Install studio gallery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-studio-gallery.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download selected Drive photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/studio assets/img/studio-gallery
          curl -L --fail --retry 2 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-8d98-81f5-b45b-130269f6b770/raw?se=2026-09-16T23%3A01%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=2b54e570-e9f9-5eb4-aba3-bba2393f34c0&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T18%3A36%3A52Z&ske=2026-09-17T18%3A36%3A52Z&sks=b&skv=2026-02-06&sig=YYeP1Y5YSW%2BI%2BrwTTr35jROmN77406c77ixsZ%2BOvqUg%3D' -o /tmp/studio/01.jpg
          curl -L --fail --retry 2 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-35c8-81f5-8832-bcff932565ed/raw?se=2026-09-16T23%3A01%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=8b044632-d773-5639-93b1-adadeb68fe29&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T18%3A39%3A10Z&ske=2026-09-17T18%3A39%3A10Z&sks=b&skv=2026-02-06&sig=XDbJ8exR82Ud%2BIuX%2BEQsh7JeT2ACorS1U66IP5VFzBI%3D' -o /tmp/studio/02.jpg
          curl -L --fail --retry 2 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-86a4-81f5-926d-661d19491044/raw?se=2026-09-16T23%3A01%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=6b29c3a7-73c7-5ff5-aa1b-2ca398421c09&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T18%3A34%3A38Z&ske=2026-09-17T18%3A34%3A38Z&sks=b&skv=2026-02-06&sig=rpGN5A7otUK4KSrVvIQNSI5w5OJRGP4qc0adZzB2Y0o%3D' -o /tmp/studio/03.jpg
          curl -L --fail --retry 2 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-94c8-81f5-be70-e567a1f9fe35/raw?se=2026-09-16T23%3A01%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=7e6ffd5c-c303-5dc4-8198-8e1627a6f4c9&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T18%3A54%3A29Z&ske=2026-09-17T18%3A54%3A29Z&sks=b&skv=2026-02-06&sig=wgd7UxnUkC0AkQhW%2B3TD8izYfgoC9rHA5V9EOc0qoIg%3D' -o /tmp/studio/04.jpg
          curl -L --fail --retry 2 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-6a34-81f5-8c3e-028d745ad125/raw?se=2026-09-16T23%3A01%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=b0d9f317-1c92-5a33-b3f5-e6865cb797ff&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T19%3A40%3A04Z&ske=2026-09-17T19%3A40%3A04Z&sks=b&skv=2026-02-06&sig=I9kJSDha6dXiTNPhFshI5AvDM4T3lO%2BqR3P7EoJBh0Y%3D' -o /tmp/studio/05.jpg
          curl -L --fail --retry 2 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-02e0-81f5-b1dc-b6ae649b935b/raw?se=2026-09-16T23%3A01%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=fada0fc4-2cad-5736-ab39-9d37539fc590&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T18%3A50%3A00Z&ske=2026-09-17T18%3A50%3A00Z&sks=b&skv=2026-02-06&sig=8xyE2YGq%2BWKWPJDRZOe%2BsicticlCMJwJz0E/G%2B0UeuY%3D' -o /tmp/studio/06.jpg
          curl -L --fail --retry 2 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-043c-81f5-a695-006f3da5bd71/raw?se=2026-09-16T23%3A01%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=3ff723e0-7a2e-55e8-a985-74c2283e7fd5&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T18%3A54%3A39Z&ske=2026-09-17T18%3A54%3A39Z&sks=b&skv=2026-02-06&sig=6UeFgLU30VpljFvxsY1ebE7CUH4iuZtkKXHgDHxm6vg%3D' -o /tmp/studio/07.jpg
      - name: Optimize to WebP
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          out=Path('assets/img/studio-gallery')
          for i in range(1,8):
              im=ImageOps.exif_transpose(Image.open(f'/tmp/studio/{i:02}.jpg')).convert('RGB')
              if im.width>1600:
                  im.thumbnail((1600,1600),Image.Resampling.LANCZOS)
              im.save(out/f'studio-gallery-{i:02}.webp','WEBP',quality=82,method=6)
          PY
      - name: Add gallery link to studio page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('estudio-fotografico/index.html')
          s=p.read_text()
          old='<a class="studioBtn" href="#tarifas">Ver tarifas</a>'
          new=old+'<a class="studioBtn" href="./galeria.html">Ver galería</a>'
          if './galeria.html' not in s and old in s:
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
      - name: Commit gallery assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/img/studio-gallery estudio-fotografico/index.html
          git diff --cached --quiet || git commit -m 'Instalar fotos optimizadas de galería del estudio'
          git push
