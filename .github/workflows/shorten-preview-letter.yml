name: Shorten preview letter

on:
  push:
    paths:
      - '.github/workflows/shorten-preview-letter.yml'

permissions:
  contents: write

jobs:
  patch-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace manifesto copy in preview index
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index-prueba.html')
          t = p.read_text()
          new = '''<article class="manifestoNote"><div class="manifestoHand"><p>Canvas nació de algo simple: disfrutar un espacio y darnos cuenta de que se disfruta el doble cuando se comparte. Aquí hemos trabajado, soñado y visto crecer proyectos que se nos quedaron grabados.</p><p>Sabemos lo que se siente tener una idea y no tener dónde hacerla realidad. No queremos que se quede esperando.</p><p>Queremos que esa maestra forme su primer grupo. Que ese taller por fin tenga salón. Que esa idea encuentre su mesa, su pared, sus primeras horas de vida.</p><p>Canvas sigue siendo nuestro espacio, y por eso lo compartimos: un espacio vacío es solo paredes. Cuando alguien hace algo suyo ahí dentro, cobra vida.</p><p class="manifestoEm">No necesitas tener tu propio local para empezar a construir algo propio.</p><div class="manifestoSignature">J VSK</div></div></article>'''
          pattern = r'<article class="manifestoNote"><div class="manifestoHand">[\s\S]*?<div class="manifestoSignature">J VSK</div></div></article>'
          t2, n = re.subn(pattern, new, t, count=1)
          if n != 1:
              raise SystemExit(f'Expected one manifesto block, found {n}')
          p.write_text(t2)
          PY
      - name: Commit change
        run: |
          git config user.name "Canvas Web Bot"
          git config user.email "canvas-web-bot@users.noreply.github.com"
          git add index-prueba.html
          git commit -m "Acortar carta de Canvas en index de prueba"
          git push
