name: Rename Qué pasa en Canvas

on:
  push:
    paths:
      - '.github/workflows/rename-que-pasa-canvas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update labels and cache versions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('assets/js/site-shell.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('>Novedades</a>', '>Qué pasa en Canvas</a>')
          p.write_text(s,encoding='utf-8')

          p=Path('assets/js/mobile-index.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("link.textContent='Novedades';", "link.textContent='Qué pasa en Canvas';")
          s=s.replace("link.setAttribute('aria-label','Novedades de Canvas');", "link.setAttribute('aria-label','Qué pasa en Canvas');")
          s=s.replace('<a href="novedades/">Novedades</a>', '<a href="novedades/">Qué pasa en Canvas</a>')
          p.write_text(s,encoding='utf-8')

          for f in Path('.').rglob('*.html'):
              if '.git' in f.parts or 'assets' in f.parts:
                  continue
              h=f.read_text(encoding='utf-8')
              h=re.sub(r'site-shell\.js\?v=\d+', 'site-shell.js?v=8', h)
              if f.as_posix()=='index.html':
                  h=re.sub(r'mobile-index\.js\?v=\d+', 'mobile-index.js?v=7', h)
              f.write_text(h,encoding='utf-8')

          tmp=Path('.github/tmp/novedades_01.txt')
          if tmp.exists(): tmp.unlink()
          PY
      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Renombrar Novedades a Qué pasa en Canvas" || exit 0
          git push
