name: Apply test header
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-test-images.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar header de index prueba
        shell: python
        run: |
          from pathlib import Path

          p = Path('index-prueba.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
              '.siteHeader{height:92px;': '.siteHeader{height:80px;',
              '.headerInner{width:min(1400px,calc(100% - 44px));margin:auto;display:flex;align-items:center;justify-content:space-between;gap:30px}': '.headerInner{width:min(1400px,calc(100% - 72px));margin:auto;display:flex;align-items:center;gap:24px}',
              '.brand img{width:34px;height:34px;object-fit:contain}': '.brand img{width:30px;height:30px;object-fit:contain}',
              '.brand span{font:600 2.05rem/1 "Cormorant Garamond",serif;letter-spacing:.16em}': '.brand span{font:500 2.15rem/1 "Cormorant Garamond",serif;letter-spacing:.18em}',
              '.nav{display:flex;align-items:center;gap:34px;font-size:.86rem}': '.nav{display:flex;align-items:center;gap:28px;font-size:.88rem;margin-left:auto;color:#56534e}',
              '.visit{border:1px solid #171717;padding:15px 20px;font-weight:700;text-decoration:none;white-space:nowrap}': '.visit{border:1px solid #171717;padding:10px 14px;font-size:.88rem;line-height:1;font-weight:600;text-decoration:none;white-space:nowrap}',
              '.visit{padding:12px 13px;font-size:.85rem}': '.visit{padding:9px 11px;font-size:.78rem}'
          }

          for old, new in replacements.items():
              if old not in s:
                  raise RuntimeError(f'No encontré el bloque esperado: {old}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit header
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-prueba.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Ajustar header de index de prueba"
          git push
