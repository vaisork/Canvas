name: Remove pricing from Canvas index

on:
  push:
    paths:
      - '.github/workflows/remove-index-pricing.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove pricing block from index
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          t=p.read_text()
          t2=re.sub(r'<section class="pricing" id="tarifas">[\s\S]*?</section>','',t,count=1)
          t2=t2.replace('<a href="#tarifas">Tarifas</a>','')
          if t2==t:
              raise SystemExit('Pricing section or nav link not found')
          p.write_text(t2)
          PY
      - name: Commit change
        run: |
          git config user.name "Canvas Web Bot"
          git config user.email "canvas-web-bot@users.noreply.github.com"
          git add index.html
          git commit -m "Mover tarifas de inicio a Canvas 90"
          git push
