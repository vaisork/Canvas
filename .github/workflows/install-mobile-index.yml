name: Install mobile index enhancements

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add mobile script to index-prueba
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index-prueba.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="assets/js/mobile-index.js?v=1" defer></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-prueba.html
          git diff --cached --quiet && exit 0
          git commit -m "Activar mejoras moviles en index-prueba"
          git push
