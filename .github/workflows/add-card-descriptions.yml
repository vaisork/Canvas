name: Add short space descriptions

on:
  push:
    paths:
      - '.github/workflows/add-card-descriptions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add brief descriptions to space cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          replacements={
            '<div><small>Amplio · transformable</small><strong>Canvas 90</strong></div>':'<div><small>Amplio · transformable</small><strong>Canvas 90</strong><span class="cardDesc">Espacio principal + jardín</span></div>',
            '<div><small>Íntimo · continuidad</small><strong>Canvas Pulso</strong></div>':'<div><small>Íntimo · continuidad</small><strong>Canvas Pulso</strong><span class="cardDesc">Para reuniones pequeñas · 16 m²</span></div>',
            '<div><small>Íntimo · comienzo</small><strong>Canvas Origen</strong></div>':'<div><small>Íntimo · comienzo</small><strong>Canvas Origen</strong><span class="cardDesc">El espacio más pequeño de Canvas · 5 m²</span></div>',
            '<div><small>Exterior · abierto</small><strong>El Jardín de Canvas</strong></div>':'<div><small>Exterior · abierto</small><strong>El Jardín de Canvas</strong><span class="cardDesc">Amenidad exterior incluida con Canvas 90</span></div>',
            '<div><small>Exterior · urbano</small><strong>Canvas Deck</strong></div>':'<div><small>Exterior · urbano</small><strong>Canvas Deck</strong><span class="cardDesc">Vestíbulo exterior de Pulso y Origen</span></div>',
          }
          for old,new in replacements.items():
              s=s.replace(old,new)

          if '.cardDesc{' not in s:
              marker='.card strong{display:block;font:600 clamp(1.55rem,2.3vw,2.15rem)/.94 "Cormorant Garamond",serif;margin:10px 0 16px}'
              insert=marker+'.cardDesc{display:block;margin-top:-8px;font-size:.68rem;line-height:1.3;color:#55514b;max-width:18ch}'
              s=s.replace(marker,insert)

          mobile='.card strong{font-size:1.5rem;margin:6px 0 0}'
          if mobile in s and '.cardDesc{font-size:.62rem' not in s:
              s=s.replace(mobile,mobile+'.cardDesc{font-size:.62rem;line-height:1.25;margin-top:4px;max-width:25ch;color:#55514b}')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Agregar descripciones breves a tarjetas de espacios" || exit 0
          git push
