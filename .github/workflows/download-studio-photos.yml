name: Download studio photos

on:
  push:
    paths:
      - '.github/workflows/download-studio-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow and requests
        run: python -m pip install pillow requests
      - name: Download and optimize images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import requests
          import io

          photos = [
              ('assets/img/studio-main.jpg', '1C_6shG2cvcP8badPdud4FUdrNCvi1Ngd', 1400),
              ('assets/img/studio-detail.jpg', '13JnNRe6JxNljlNXZ3Ppsqlq3JnXr2KG-', 1000),
              ('assets/img/studio-wide.jpg', '1EPgs6SJUE_aJL5ReAgOk_Q64JtrIETTp', 1000),
          ]
          Path('assets/img').mkdir(parents=True, exist_ok=True)
          for path, file_id, max_width in photos:
              url = 'https://drive.google.com/uc?export=download&id=' + file_id
              response = requests.get(url, timeout=60)
              response.raise_for_status()
              image = Image.open(io.BytesIO(response.content)).convert('RGB')
              if image.width > max_width:
                  height = round(image.height * max_width / image.width)
                  image = image.resize((max_width, height), Image.Resampling.LANCZOS)
              image.save(path, 'JPEG', quality=76, optimize=True, progressive=True)
          PY
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/studio-main.jpg assets/img/studio-detail.jpg assets/img/studio-wide.jpg
          git commit -m "Agregar fotos del estudio fotografico" || exit 0
          git push
