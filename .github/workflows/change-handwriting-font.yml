name: Cambiar tipografia manuscrita del index

on:
  push:
    paths:
      - '.github/workflows/change-handwriting-font.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cambiar fuente manuscrita por Caveat
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('family=Nothing+You+Could+Do&display=swap','family=Caveat:wght@500;600&display=swap')
          s=s.replace('"Nothing You Could Do",cursive','"Caveat",cursive')
          s=s.replace("'Nothing You Could Do',cursive","'Caveat',cursive")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Mejorar legibilidad de tipografia manuscrita" || exit 0
          git push
