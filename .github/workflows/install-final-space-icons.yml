name: Install final Canvas space icons

on:
  push:
    paths:
      - '.github/workflows/install-final-space-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install final Origen and Pulso icons
        shell: bash
        run: |
          mkdir -p assets/img
          cat > /tmp/icons.b64 <<'EOF'

EOF
          base64 -d /tmp/icons.b64 > /tmp/icons.zip
          unzip -o /tmp/icons.zip -d assets/img
      - name: Commit final icons
        run: |
          git config user.name "Canvas Web Bot"
          git config user.email "canvas-web-bot@users.noreply.github.com"
          git add assets/img/icon-origen.png assets/img/icon-pulso.png
          git diff --cached --quiet || git commit -m "Install final Canvas Origen and Pulso icons"
          git push
