name: Finalize studio gallery
on:
  push:
    paths:
      - '.github/workflows/finalize-studio-gallery.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add gallery link and clean temp files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('estudio-fotografico/index.html')
          s=p.read_text(encoding='utf-8')
          if 'href="galeria.html"' not in s:
              old='<a class="studioBtn" href="#tarifas">Ver tarifas</a>'
              new=old+'<a class="studioBtn" href="galeria.html">Ver galería</a>'
              if old not in s:
                  raise SystemExit('No se encontró el botón Ver tarifas')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
          rm -rf assets/img/studio-gallery
          rm -f .github/workflows/install-studio-gallery.yml
          rm -f .github/workflows/finalize-studio-gallery.yml
      - name: Commit final studio gallery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Terminar galería de Estudio Fotográfico'
          git push