<script>
document.querySelectorAll('#gallery .shot').forEach(el=>{
  el.onclick=()=>open(el.querySelector('img').src);
  el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(el.querySelector('img').src)}};
});
const lb=document.getElementById('lightbox'),lbImg=document.getElementById('lightboxImg');
function open(src){lbImg.src=src;lb.classList.add('open');document.body.style.overflow='hidden'}
function closeLb(){lb.classList.remove('open');lbImg.src='';document.body.style.overflow=''}
lb.querySelector('.close').onclick=closeLb;lb.onclick=e=>{if(e.target===lb)closeLb()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLb()});
</script>
