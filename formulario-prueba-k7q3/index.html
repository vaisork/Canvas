<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Formulario de prueba · Canvas 90</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#167E8C;--yellow:#E0A51E;--coral:#E8644F;--paper:#fffefb;--ink:#1d2326;--line:#e4ded3}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:32px 16px 48px}
h1{font:600 2.3rem/1.1 'Cormorant Garamond',serif;color:var(--teal);margin:0 0 6px}
p.lead{margin:0 0 24px;color:#5b6468}
label{display:block;font-weight:600;font-size:.9rem;margin:16px 0 6px}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);border-color:transparent}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{margin-top:24px;width:100%;padding:14px;border:0;border-radius:999px;background:var(--teal);color:#fff;font:600 1rem Inter,sans-serif;cursor:pointer}
button:disabled{opacity:.6}
#estado{margin-top:16px;padding:12px 14px;border-radius:10px;display:none}
#estado.ok{display:block;background:#e6f3f1;color:var(--teal)}
#estado.error{display:block;background:#fdeceb;color:#a33a2b}
.trampa{position:absolute;left:-9999px}
</style>
</head>
<body>
<main>
  <h1>Formulario de prueba</h1>
  <p class="lead">Canvas 90 · Llena tus datos y presiona Enviar.</p>
  <form id="f" novalidate>
    <label for="nombre">Nombre</label>
    <input id="nombre" name="nombre" maxlength="80" autocomplete="name" required>
    <label for="direccion">Dirección</label>
    <textarea id="direccion" name="direccion" rows="2" maxlength="200" autocomplete="street-address" required></textarea>
    <label for="telefono">Teléfono</label>
    <input id="telefono" name="telefono" type="tel" inputmode="tel" maxlength="20" autocomplete="tel" required>
    <label for="ocupacion">¿A qué te dedicas?</label>
    <input id="ocupacion" name="ocupacion" maxlength="80" required>
    <div class="fila">
      <div>
        <label for="edad">¿Cuántos años tienes?</label>
        <input id="edad" name="edad" type="number" inputmode="numeric" min="1" max="120" required>
      </div>
      <div>
        <label for="sexo">Sexo</label>
        <select id="sexo" name="sexo" required>
          <option value="">Elige…</option>
          <option>Mujer</option><option>Hombre</option><option>Indefinido</option><option>Prefiero no decir</option>
        </select>
      </div>
    </div>
    <input class="trampa" name="sitio" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button id="b" type="submit">Enviar</button>
    <div id="estado" role="status" aria-live="polite"></div>
  </form>
</main>
<script>
const f = document.getElementById('f'), b = document.getElementById('b'), estado = document.getElementById('estado');
function aviso(clase, texto){ estado.className = clase; estado.textContent = texto; }
f.addEventListener('submit', async e => {
  e.preventDefault();
  if (!f.reportValidity()) return;
  b.disabled = true; b.textContent = 'Enviando…';
  try {
    const r = await fetch('https://jdiaz.tail3d212e.ts.net/formulario/enviar', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(Object.fromEntries(new FormData(f)))
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.ok) { aviso('ok', '¡Listo! Recibimos tus datos. Gracias.'); f.reset(); }
    else aviso('error', d.error || 'No se pudo enviar. Intenta de nuevo.');
  } catch { aviso('error', 'Sin conexión. Intenta de nuevo.'); }
  b.disabled = false; b.textContent = 'Enviar';
});
</script>
</body>
</html>
